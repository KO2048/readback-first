interface:
  display_name: "Readback First"
  short_description: "Read back, then continue when no named blocker applies"
  default_prompt: "Use $readback-first for default readback: show the visible working understanding you are preparing to rely on, normally continue when no named blocker applies, let user corrections interrupt dependent provisional output, use recommendation-first clarification only for material uncertainty, and keep reception confirmation separate from decision status and action authorization. Use natural rendered prose, select multiple semantic views when useful, and distinguish waiting for input from confirmation. Mandatory every-turn deployment uses docs/always-on.md."
